spring:
  application:
    name: taxi-fleet
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taxi_fleet}
    username: ${DB_USER:taxi}
    password: ${DB_PASSWORD:taxi}
  jpa:
    open-in-view: false          # Las entidades no viajan a la capa web: se mapean a DTO dentro de la transacción
    hibernate:
      ddl-auto: validate         # El esquema lo gobierna Flyway; Hibernate solo valida
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

# ---------------------------------------------------------------------------
# Configuración de negocio
# ---------------------------------------------------------------------------
fleet:
  cors:
    allowed-origins:
      - http://localhost:5173
  security:
    # Clave para firmar los tokens de sesión (mínimo 32 caracteres).
    # EN PRODUCCIÓN define la variable de entorno JWT_SECRET con un valor propio y secreto.
    jwt-secret: ${JWT_SECRET:clave-solo-para-desarrollo-cambiala-en-produccion-123}
    jwt-ttl: 8h
  pico-placa:
    # Taxis de Bogotá: los dígitos rotan en pares y el par restringido avanza un paso cada
    # día de lunes a sábado (domingos y festivos no hay restricción; los festivos que caen
    # de lunes a sábado igual cuentan como un paso del ciclo).
    # El ciclo se calcula desde un día "ancla" conocido. Si la Secretaría de Movilidad
    # reinicia o cambia la rotación, actualiza la fecha y los dígitos de ese día.
    # Verificado con pyphoy.com y los boletines de bogota.gov.co: el 5-nov-2026 restringen 5 y 6.
    anchor-date: "2026-11-05"
    anchor-digits: [5, 6]
    groups:
      - [1, 2]
      - [3, 4]
      - [5, 6]
      - [7, 8]
      - [9, 0]
    # Los festivos de Colombia se calculan solos. Aquí solo van festivos extraordinarios
    # decretados (formato AAAA-MM-DD).
    extra-holidays: []
